    function initSMS_json_data(message_data_json_tmp){
        //console.log("message_data_json_tmp [0].phoneNum: " + message_data_json_tmp.message[0].phone_number);
        message_data_array = message_data_json_tmp.message;
        if(message_data_array.length <= 0){
            console.log("message list is empty");
            message_prePhonenum_lastSMS_array = [];
            initMessageContactTable(message_prePhonenum_lastSMS_array);
            return;
        }
        message_prePhonenum_lastSMS_array = [];
        message_data_array.sort(function(a, b) {
            return b.time - a.time;
        });
        message_data_array.sort(function(a, b) {
            return b.phone_number - a.phone_number;
        });
        var phoneNum = message_data_array[0].phone_number;
        for(var i=0 ; i<message_data_array.length ; i++){
            var phoneNum_tmp = message_data_array[i].phone_number;
            /*
            console.log("message_data_array["+i+"].phone_number: "+message_data_array[i].phone_number +
                        ", message_data_array["+i+"].time: "+message_data_array[i].time);
            */
            if(phoneNum != phoneNum_tmp){
                phoneNum = phoneNum_tmp;

                /* check if already record the phone number */
                if(message_prePhonenum_lastSMS_array.length == 0){
                    message_prePhonenum_lastSMS_array.push(message_data_array[i-1]);
                } else{
                    for(var j=0; j<message_prePhonenum_lastSMS_array.length; j++){
                        /* update last context */
                        if(message_prePhonenum_lastSMS_array[j].phone_number === message_data_array[i-1].phone_number){
                            message_prePhonenum_lastSMS_array[j] = message_data_array[i-1];
                            break;
                        }

                        if(j == message_prePhonenum_lastSMS_array.length-1)
                            message_prePhonenum_lastSMS_array.push(message_data_array[i-1]);
                    }
                }
            }
        }

        /* last sms message */
        if(message_prePhonenum_lastSMS_array.length == 0){
            message_prePhonenum_lastSMS_array.push(message_data_array[message_data_array.length-1]);
        } else{
            for(var i=0; i<message_prePhonenum_lastSMS_array.length; i++){
                if(message_prePhonenum_lastSMS_array[i].phone_number === message_data_array[message_data_array.length-1].phone_number){
                    message_prePhonenum_lastSMS_array[i] = message_data_array[message_data_array.length-1];
                    break;
                }

                if(i == message_prePhonenum_lastSMS_array.length-1)
                    message_prePhonenum_lastSMS_array.push(message_data_array[message_data_array.length-1]);
            }
        }

        for(var i=0 ; i<message_prePhonenum_lastSMS_array.length ; i++){
        /*
            console.log("message_data_array["+i+"].phone_number: "+message_prePhonenum_lastSMS_array[i].phone_number +
                        ", message_data_array["+i+"].time: "+message_prePhonenum_lastSMS_array[i].time);
        */
            var tmpKey = message_prePhonenum_lastSMS_array[i].phone_number;
            var tmpArray = [];
            var unread_num = 0;
            for(var j=0 ; j<message_data_array.length ; j++){
                if(message_prePhonenum_lastSMS_array[i].phone_number === message_data_array[j].phone_number){
                    tmpArray.push(message_data_array[j]);
                    if(message_data_array[j].read_status == 0){
                        unread_num++;
                    }
                }
            }
            message_preClass_json[tmpKey] = tmpArray;
            message_prePhonenum_lastSMS_array[i].unread_num = unread_num;
            message_prePhonenum_lastSMS_array[i].Class = tmpKey;
            message_prePhonenum_lastSMS_array[i].onCheck = false;
        }
        //console.log("message_preClass_json:" + JSON.stringify(message_preClass_json));
        initMessageContactTable(message_prePhonenum_lastSMS_array);
    }

    var instanceArray = [];
    function initChatScreenCon(){
        var currentChatArray = [];
        currentChatArray = message_preClass_json[phone_Num];
        document.getElementById('_sendChat_dialog_modal_header').innerHTML = phone_Num;
        var chatList = document.getElementById('chat_card_body');
        var chatListCon = '';
        var chatListAll = '';
        var delivered = '';
        var delivered_color = 'chatStatusColor';
        var not_delivered_icon = '';
        chatList.innerHTML = '';
        for(var i=0 ; i<currentChatArray.length ; i++){
            //console.log("currentChat: " + JSON.stringify(currentChatArray[i]));
            chatListCon = '';
            if(currentChatArray[i].read_status > 1){
                if(currentChatArray[i].read_status == 6){
                //if(1){
                    delivered = currentChatArray[i].time+'<br>Delivered';
                    not_delivered_icon = '';
                }else{
                    delivered = 'Not Delivered';
                    not_delivered_icon = '<img alt="'+ i18next.t('sms_status_warn') +'" id="'+platform+'tb_chat_warning'+i+'img" src="/images/ic_chat_warning.svg">';
                }
                chatListCon = '<div class="d-flex flex-row justify-content-end mb-0" id="'+platform+'tb_Delivered'+i+'">'+
                      not_delivered_icon+
                      '<div class="p-3" id="'+platform+'tb_Delivered_context'+i+'div">'+
                        '<p class="small mb-0" id="'+platform+'tb_Delivered_context'+i+'"></p>'+
                      '</div>'+
                      '<div class="inner_send"></div>'+
                    '</div>'+
                        '<label class="d-flex justify-content-end mb-4 me-1" id="'+platform+'tb_Delivered_sta'+i+'">'+delivered+'</label>';
            }else{
                chatListCon = '<div class="d-flex flex-row justify-content-start mb-0" id="'+platform+'tb_Delivered'+i+'">'+
                  '<div class="inner_receive"></div>'+
                  '<div class="p-3" id="'+platform+'tb_Delivered_context'+i+'div">';
            	if(currentChatArray[i].context === undefined){
                    chatListCon = chatListCon+
                        '<p class="small mb-0" id="'+platform+'tb_Delivered_context'+i+'">'+'Wait...'+'</p>';
            	}else{
                    chatListCon = chatListCon+
                        '<p class="small mb-0" id="'+platform+'tb_Delivered_context'+i+'"></p>';
            	}
                chatListCon = chatListCon+
                  '</div>'+
                '</div>'+
                    '<label class="d-flex justify-content-start mb-4 ms-1" id="'+platform+'tb_Delivered_sta'+i+'">'+currentChatArray[i].time+'</label>';
            }
            chatListAll += chatListCon;
        }
        chatList.innerHTML = chatListAll;
        
        for(var i=0 ; i<currentChatArray.length ; i++)(function(i)
        {
            if(currentChatArray[i].read_status > 1){
                delivered_color = 'chatStatusColor';
                if(currentChatArray[i].read_status != 6){
                    delivered_color = 'errorColor';
                    document.getElementById(platform+"tb_chat_warning"+i+"img").style = "width: 24px; height: 100%; margin:6px;";
                }
                document.getElementById(platform+"tb_Delivered"+i).style = "padding:0;align-items: center;";
                document.getElementById(platform+"tb_Delivered_context"+i+"div").style = "border-radius: 5px; border-bottom-right-radius: 0; background-color: var(--warningColor); max-width: 300px;";
                document.getElementById(platform+"tb_Delivered_context"+i).style = "color: var(--sendChatColor); font: normal normal 500 18px/21px Roboto; word-wrap:break-word;";
                document.getElementById(platform+"tb_Delivered_context"+i).innerText = currentChatArray[i].context;
                document.getElementById(platform+"tb_Delivered_sta"+i).style = "margin-top:7px; padding:0;color: var(--"+delivered_color+"); font: normal normal 400 12px/14px Roboto; text-align: right;";
            }else{
                document.getElementById(platform+"tb_Delivered"+i).style = "padding:0;";
                document.getElementById(platform+"tb_Delivered_context"+i+"div").style = "border-radius: 5px; border-bottom-left-radius: 0; background-color: var(--trColor); max-width: 300px;";
                document.getElementById(platform+"tb_Delivered_context"+i).style = "color: var(--receiveChatColor); font: normal normal 500 18px/21px Roboto; word-wrap:break-word;";                
                if(currentChatArray[i].context === undefined){
                    document.getElementById(platform+"tb_Delivered_context"+i).innerText = i18next.t('sms_wait');
            	}else{
                    document.getElementById(platform+"tb_Delivered_context"+i).innerText = currentChatArray[i].context;
            	}
                document.getElementById(platform+"tb_Delivered_sta"+i).style = "margin-top:7px; padding:0;color: var(--chatStatusColor); font: normal normal 400 12px/14px Roboto; text-align: left;";
            }
        })(i);

        if(currentChatArray[currentChatArray.length - 1].unread_num > 0){
            var modal = document.getElementById('chat_card_body');
            modal.scrollTo({
              top: modal.scrollHeight,
              left: 0,
              behavior: 'smooth'
            });
            // req unread -> read
            for(var i=0 ; i<currentChatArray.length ; i++){
                if(currentChatArray[i].read_status == 0){
                    instanceArray.push(currentChatArray[i].index);
                }
            }
            updateSMS_readStatus();
        }
    }
    function showChatScreen (num){
        phone_Num = message_search_array[num].phone_number;

        //console.log("message_preClass_json:" + JSON.stringify(message_preClass_json));
        initChatScreenCon();
        toggle_sendChat_dialog_modal();
    }
    
    function updateSMS_readStatus_response(data_json){
        if(!data_json.result){
            //console.log("res: " + JSON.stringify(data_json));
            setTimeout(() => {window.location.href = "/cgi-bin/cm/adm-sms.html";}, 1000);
        }else {
            //console.log("res: " + JSON.stringify(data_json));
            document.getElementById("RequestVerifyToken").value = data_json.RequestVerifyToken;
        }
    }
    function updateSMS_readStatus(){
        //prepare json data
        const req = {}; //create javascript object;
        req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;
        //req.phone_number = phone_Num;
        req.list_length = instanceArray.length;

    function composeSMS(){
        if(document.getElementById('RecipientsInput').value.length > 0){
            var recipientsArray = document.getElementById('RecipientsInput').value.split(', ');
            var isInvalid = false;
            for(var i=0 ; i<recipientsArray.length ; i++){
                isInvalid = false;
                if(validatePhoneNum(recipientsArray[i])){

            if(!isInvalid){

                document.getElementById('RecipientsInput').style = 'border-bottom: 2px solid var(--errorColor);color: var(--errorColor);';

            }else{
                //prepare json data
                const req = {}; //create javascript object;
                req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;
                req.Recipients = recipientsArray.toString();
                req.RecipientsNum = recipientsArray.length;
                req.SMScontext = document.getElementById('ComposeTextarea').value;

                toggle_smsCompose_modal();
                document.getElementById('_modal_text').innerHTML = i18next.t('sms_dialog_sending');

                do_fetch_api("POST", "/cgi-bin/cgi/req_smsCompose.cgi", req)
                .then(response => {setTimeout(toggle_modal,1000); return response}).then(composeSMS_response).catch(response_print);

            }
        }else{
            //show_EditError("Please enter at least one contact information.");
            document.getElementById('invalidRecipientLabel').style = 'display: inline-block;color: var(--errorColor);text-align: left;font: normal normal 500 12px/14px Roboto;';
