	var platform = "";

    function bodyLoad()
	{
        /* menuOnLoad() is needed for every page, input parameter indicates actived menu item */
        menuOnLoad("fw-urlfilter.html");
		do_fetch_api("POST", "/cgi-bin/cgi/token_query.cgi", '{}').then(update_content).catch(response_print);
        /* Add your onload function call here: Start */
        mobile_CollapsibleAddListener('collapseIAF');
        mobile_CollapsibleAddListener('collapseIAFL');
		saveLoadingListener();
		saveAddListener();
		saveDialogListener();
		var rule_list = parent_control_profile_get.split(";");
		for(var i = 0; i < rule_list.length-1; i++)
        {
			console.log("rule_list[i] = "+rule_list[i])
			var instance = rule_list[i].split(",")[0];
			var rule = rule_list[i].split(",")[1];
			var createJosn = {};
			createJosn.instance = instance;
			createJosn.web_index = i+1;
			createJosn.url = rule;
			url_array.push(createJosn);
		}

		if(window.innerWidth >= 1400)
			platform_o = 'xxl';
		else if(window.innerWidth < 1400 && window.innerWidth >= 576 )
			platform_o = 'xl';
		else if(window.innerWidth < 576)
			platform_o = 'mobile';
		initJS_function(platform_o);

        onScreenWidthChange();//First time Init
        window.onresize = function(event) {
            onScreenWidthChange();
        }
        /* Add your onload function call here: End */
    }
	function initJS_function(pf){
		document.getElementById(pf + "-urlfilter_switch").onchange = function(){switch_status();};
		document.getElementById(pf + "-url_filter_List").style = 'display: none;';
		document.getElementById(pf + "-filterMode_white").onclick = function(){selectObj(pf + '-filterMode', i18next.t('urlFilter_mode_whitelist'));};
		document.getElementById(pf + "-filterMode_black").onclick = function(){selectObj(pf + '-filterMode', i18next.t('urlFilter_mode_blacklist'));};
		document.getElementById(pf + "-modal_alertBtn").onclick = function(){modal_alert();};
		document.getElementById(pf + "-addNewBtn").onclick = function(){toggle_add_modal();};
		if(pf != "mobile")
		{
			document.getElementById(pf + "-MaxLimtLabel").style = 'float: right; padding: 5px 15px;';
			document.getElementById(pf + "-sortNumberBtn").onclick = function(){sortNumber();};
			document.getElementById(pf + "-sortURLBtn").onclick = function(){sortURL();};
		}
		document.getElementById("add_urlfilterBtn").onclick = function(){add_urlfilter();};
		document.getElementById("edit_urlfilterBtn").onclick = function(){edit_rule_save();};
		document.getElementById("_dialog_modal_warningBtn").onclick = function(){toggle_dialog_modal();};
		document.getElementById("confirm_deleteBtn").onclick = function(){confirm_delete();};
		document.getElementById("alertSaveIPBtn").onclick = function(){btnOKClicked();};
		
		dropdownItemKeyboardNavigation(pf + "-filterMode_white");
		dropdownItemKeyboardNavigation(pf + "-filterMode_black");
	}
	function update_content(data_json)
	{
		document.getElementById("RequestVerifyToken").value = data_json.RequestVerifyToken;
	}
	function onScreenWidthChange()
	{
        if(window.innerWidth >= 1400)
            platform = 'xxl';
        else if(window.innerWidth < 1400 && window.innerWidth >= 576 )
            platform = 'xl';
        else if(window.innerWidth < 576)
            platform = 'mobile';

		if(platform != platform_o){
            initJS_function(platform);
            platform_o = platform;
        }

		if(parent_control_profile_enabled == 0)
		{
			document.getElementById(platform + "-url_filter_List").style.display = "none";
			document.getElementById(platform + "-urlfilter_switch").checked = false;
			document.getElementById(platform + "-filterMode_title").style = "color: var(--disabledText);";
            document.getElementById(platform + "-filterMode").disabled = true;
            document.getElementById(platform + "-filterMode_dropdown").disabled = true;
		}
        else
		{
			document.getElementById(platform + "-url_filter_List").style.display = "block";
			document.getElementById(platform + "-urlfilter_switch").checked = true;
			document.getElementById(platform + "-filterMode_title").style = "color: var(--headingText);";
            document.getElementById(platform + "-filterMode").disabled = false;
            document.getElementById(platform + "-filterMode_dropdown").disabled = false;
		}

        selectObj_init(platform);

		var rule_list = parent_control_profile_get.split(";");
		if(rule_list.length >= 11)
		{
			document.getElementById(platform + "-addNewBtn").style = "color: var(--disabledText);";
			document.getElementById(platform + "-addNewBtn").disabled = true;
			document.getElementById(platform + '-addNewImg').src="/images/iconAddNewDisable.svg";
			document.getElementById(platform + "-MaxLimtLabel").style = "float: right; padding: 5px 15px;; color: var(--errorColor);";
		}
		initAddrListTable(url_array);
    }
    function selectObj_init(platform) {
		if(isAllow == 1)
		{
			selectObj(platform + '-filterMode', i18next.t('urlFilter_mode_whitelist'));
		}
		else if(isAllow == 0)
		{
			selectObj(platform + '-filterMode', i18next.t('urlFilter_mode_blacklist'));
		}
    }
	function switch_status()
	{
        if(document.getElementById(platform + "-urlfilter_switch").checked)
		{
			document.getElementById(platform + "-url_filter_List").style.display = "block";
			document.getElementById(platform + "-filterMode_title").style = "color: var(--headingText);";
            document.getElementById(platform + "-filterMode").disabled = false;
            document.getElementById(platform + "-filterMode_dropdown").disabled = false;
		}
        else
		{
			document.getElementById(platform + "-url_filter_List").style.display = "none";
			document.getElementById(platform + "-filterMode_title").style = "color: var(--disabledText);";
            document.getElementById(platform + "-filterMode").disabled = true;
            document.getElementById(platform + "-filterMode_dropdown").disabled = true;
		}
    }
	function initAddrListTable(entries)
	{
		<!-- var rule_list = parent_control_profile_get.split(";"); -->
        var tbodystaticAddrList = document.getElementById(platform + '-tbodystaticUrlList');
        var tbodystaticAddrListCon = '';
        var tbodystaticAddrListAll = '';
        var deleteIcon = '';
        tbodystaticAddrList.innerHTML = '';

		for(var i = 0; i < entries.length; i++)
		{
			var idx = entries[i].web_index;
			var url = entries[i].url;
			tbodystaticAddrListCon = '<tr class="cardViewTableTR">';
			if(platform != 'mobile')
			{
				tbodystaticAddrListCon = tbodystaticAddrListCon + '<td class="cardViewTableTD"><label>' +idx+ '</label></td>';
			}
            tbodystaticAddrListCon = tbodystaticAddrListCon + '<td class="cardViewTableTD urlText"><label>' +url+ '</label></td>';
			if(platform == 'mobile')
			{
				<!-- detailInfo = '<button class="btn" id="more_info_' + idx + '"><img src="/images/iconMore.svg"></button>'; -->
				editIcon = '<button class="btn" id="edit_rule_' + idx + '"><img src="/images/ic_edit.svg" alt="' +i18next.t('urlFilter_set_edit_alt')+ '"></button>';
				deleteIcon = '<button class="btn" id="deleteItem_' + i + '"><img src="/images/ic_delete.svg" alt="' +i18next.t('urlFilter_set_del_alt')+ '"></button>';
//				editIcon = '<button class="btn" id="edit_rule_' + idx + '"><img src="/images/ic_edit.svg"></button>';
//				deleteIcon = '<button class="btn" id="deleteItem_' + i + '"><img src="/images/ic_delete.svg"></button>';
				<!-- tbodystaticAddrListCon = tbodystaticAddrListCon + '<td class="cardViewTableTD"><label>' + detailInfo + editIcon + deleteIcon + '</label></td>'; -->
				tbodystaticAddrListCon = tbodystaticAddrListCon + '<td class="cardViewTableTD"><label>' + editIcon + deleteIcon + '</label></td>';
			}
			else
			{
				editIcon = '<button class="btn" id="edit_rule_' + idx + '"><img src="/images/ic_edit.svg" alt="' +i18next.t('urlFilter_set_edit_alt')+ '"></button>';
				deleteIcon = '<button class="btn" id="deleteItem_' + i + '"><img src="/images/ic_delete.svg" alt="' +i18next.t('urlFilter_set_del_alt')+ '"></button>';
//				editIcon = '<button class="btn" id="edit_rule_' + idx + '"><img src="/images/ic_edit.svg"></button>';
//				deleteIcon = '<button class="btn" id="deleteItem_' + i + '"><img src="/images/ic_delete.svg"></button>';
				tbodystaticAddrListCon = tbodystaticAddrListCon + '<td class="cardViewTableTD"><label>' + editIcon + deleteIcon + '</label></td>';
			}			
            tbodystaticAddrListCon += '</tr>';
            tbodystaticAddrListAll += tbodystaticAddrListCon;
		}
        tbodystaticAddrList.innerHTML = tbodystaticAddrListAll;
		for(var i = 0; i < entries.length; i++)(function(i){
			var idx = entries[i].web_index;
            document.getElementById("edit_rule_"+idx).onclick = function(){edit_rule(idx);};
            document.getElementById("deleteItem_"+i).onclick = function(){deleteItem(i);};
        })(i);
    }
	function more_info(i)
	{
		document.getElementById('_more_item').innerHTML = url_array[i-1].web_index;

	function edit_rule(idx)
	{
		var rule_list = parent_control_profile_get.split(";");
		var instance = rule_list[idx-1].split(",")[0];
		var rule = rule_list[idx-1].split(",")[1];
		document.getElementById('edit_url_Addr').value = rule;
        toggle_edit_modal();

		g_handler = instance;
    }
	function edit_rule_save()
	{
		resetInputStyle();
		var url_Addr = document.getElementById("edit_url_Addr");
		if(checkEmpty(url_Addr))
		{
			document.getElementById("edit_url_title").style = "color: var(--errorColor);";
			document.getElementById("edit_url_Addr").style = "color: var(--errorColor);";
			document.getElementById("edit_url_div").style.borderBottom = "1px solid var(--errorColor)";
			document.getElementById('edit_url_error').style.display = 'block';
			document.getElementById('edit_url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes');
			document.getElementById("edit_url_Addr").focus();
			return;
		}
		if(url_Addr.value.length >= 128 )
		{
			document.getElementById("edit_url_title").style = "color: var(--errorColor);";
			document.getElementById("edit_url_Addr").style = "color: var(--errorColor);";
			document.getElementById("edit_url_div").style.borderBottom = "1px solid var(--errorColor)";
			document.getElementById('edit_url_error').style.display = 'block';
			document.getElementById('edit_url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes2');
			document.getElementById("edit_url_Addr").focus();
			return;
		}
		if(!validateURL(url_Addr.value))
		{
			document.getElementById("edit_url_title").style = "color: var(--errorColor);";
			document.getElementById("edit_url_Addr").style = "color: var(--errorColor);";
			document.getElementById("edit_url_div").style.borderBottom = "1px solid var(--errorColor)";
			document.getElementById('edit_url_error').style.display = 'block';
			document.getElementById('edit_url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes3');
			document.getElementById("edit_url_Addr").focus();
			return;
		}
		if(isValidURLStr(url_Addr.value) == false )
		{
			document.getElementById("edit_url_title").style = "color: var(--errorColor);";
			document.getElementById("edit_url_Addr").style = "color: var(--errorColor);";
			document.getElementById("edit_url_div").style.borderBottom = "1px solid var(--errorColor)";
			document.getElementById('edit_url_error').style.display = 'block';
			document.getElementById('edit_url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes4');
			document.getElementById("edit_url_Addr").focus();
			return;
		}
		for(var i = 0; i < url_array.length; i++)
		{
			var url = url_array[i].url;
			if(url == url_Addr.value)
			{
				document.getElementById("edit_url_title").style = "color: var(--errorColor);";
				document.getElementById("edit_url_Addr").style = "color: var(--errorColor);";
				document.getElementById("edit_url_div").style.borderBottom = "1px solid var(--errorColor)";
				document.getElementById('edit_url_error').style.display = 'block';
				document.getElementById('edit_url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes5');
				document.getElementById("edit_url_Addr").focus();
				return;
			}
		}

		<!-- var rule_list = parent_control_profile_get.split(";"); -->
		<!-- var rule = rule_list[g_handler-1]; -->
		<!-- ori_url_addr = rule; -->

		toggle_edit_modal();
		document.getElementById('modal_AddURLfilter').style = "display: none";
		document.getElementById('_modal_text').innerHTML = i18next.t('urlFilter_save_loading');
		toggle_modal();

		<!-- //prepare json data -->
		const req = {}; //create javascript object;
		req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;
		<!-- req.ori_url_addr = ori_url_addr; -->
		<!-- req.new_url_addr = document.getElementById('edit_url_Addr').value; -->
		req.edit_instance = g_handler;
		req.new_url_addr = document.getElementById('edit_url_Addr').value;
		//console.log("req = " + JSON.stringify(req));
		do_fetch_api("POST", "/cgi-bin/cgi/urlfilter_edit.cgi", req)
            .then(response_add_urlfilter).catch(response_print);
	}

        var _myModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('_loadingModal'));
        _myModal.toggle();
    }
	var counter = 0;
    function toggle_img()
	{
        let img1 = document.getElementById('_loading_img1');
        var degree = (10 * counter++)%360;
         img1.style.transform = "rotate("+degree+"deg)";
    }
	function saveLoadingListener()
	{
        var myTimer;
        var myModalEl = document.getElementById('_loadingModal');
        myModalEl.addEventListener('show.bs.modal', function (event) {
            myTimer = setInterval(toggle_img, 30);
        });
        myModalEl.addEventListener('hidden.bs.modal', function (event) {
            clearInterval(myTimer);
            counter = 0;
        });
    }

	function modal_alert()
	{
		if(document.getElementById(platform + "-filterMode").innerHTML == "Allow" && parent_control_profile_get == "" && document.getElementById(platform + "-urlfilter_switch").checked)
		{
			document.getElementById('_alert_modal_title').style = "color: var(--warningColor);";
			document.getElementById('_alert_modal_text').innerHTML = i18next.t('urlFilter_dialog_des1');
			toggle_alert_modal()
		}
		else
		{
			btnOKClicked()
		}
	}
	function btnOKClicked()
	{
		if(document.getElementById(platform + "-urlfilter_switch").checked)
		{
			var enable = 1;
		}
		else
		{
			var enable = 0;
		}
		if(document.getElementById(platform + "-filterMode").innerHTML == i18next.t('urlFilter_mode_blacklist'))
		{
			isAllow = 0
		}
		else
		{
			isAllow = 1
		}
		if(document.getElementById(platform + "-filterMode").innerHTML == "Allow" && parent_control_profile_get == "" && document.getElementById(platform + "-urlfilter_switch").checked)
		{
			toggle_alert_modal()
		}

		document.getElementById('modal_AddURLfilter').style = "display: none";
		document.getElementById('_modal_text').innerHTML = i18next.t('urlFilter_save_loading');
		toggle_modal();

		//prepare json data
        const req = {}; //create javascript object;
        req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;
		req.state = enable;
		req.mode = isAllow;
		//console.log("req = " + JSON.stringify(req));
		do_fetch_api("POST", "/cgi-bin/cgi/urlfilter_status_save.cgi", req)
            .then(response_add_ipfilter).catch(response_print);
	}
	function resetInputStyle()
	{
		document.getElementById("url_title").style = "color: var(--headingText);";
		document.getElementById("url_Addr").style = "color: var(--headingText);";
		document.getElementById("url_div").style.borderBottom = "1px solid var(--inputBorder)";
		document.getElementById('url_error').style.display = 'none';
		document.getElementById('url_error').innerHTML = '';
	}
	function add_urlfilter()
	{
		resetInputStyle();
		var url_Addr = document.getElementById("url_Addr");
		if(checkEmpty(url_Addr))
		{
			document.getElementById("url_title").style = "color: var(--errorColor);";
			document.getElementById("url_Addr").style = "color: var(--errorColor);";
			document.getElementById("url_div").style.borderBottom = "1px solid var(--errorColor)";
			document.getElementById('url_error').style.display = 'block';
			document.getElementById('url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes');
			document.getElementById("url_Addr").focus();
			return;
		}
		if(url_Addr.value.length >= 128 )
		{
			document.getElementById("url_title").style = "color: var(--errorColor);";
			document.getElementById("url_Addr").style = "color: var(--errorColor);";
			document.getElementById("url_div").style.borderBottom = "1px solid var(--errorColor)";
			document.getElementById('url_error').style.display = 'block';
			document.getElementById('url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes2');
			document.getElementById("url_Addr").focus();
			return;
		}
		if(!validateURL(url_Addr.value))
		{
			document.getElementById("url_title").style = "color: var(--errorColor);";
			document.getElementById("url_Addr").style = "color: var(--errorColor);";
			document.getElementById("url_div").style.borderBottom = "1px solid var(--errorColor)";
			document.getElementById('url_error').style.display = 'block';
			document.getElementById('url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes3');
			document.getElementById("url_Addr").focus();
			return;
		}
		if(isValidURLStr(url_Addr.value) == false )
		{
			document.getElementById("url_title").style = "color: var(--errorColor);";
			document.getElementById("url_Addr").style = "color: var(--errorColor);";
			document.getElementById("url_div").style.borderBottom = "1px solid var(--errorColor)";
			document.getElementById('url_error').style.display = 'block';
			document.getElementById('url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes4');
			document.getElementById("url_Addr").focus();
			return;
		}
		
		for(var i = 0; i < url_array.length; i++)
        {
			var url = url_array[i].url;
			if(url == url_Addr.value)
			{
				document.getElementById("url_title").style = "color: var(--errorColor);";
				document.getElementById("url_Addr").style = "color: var(--errorColor);";
				document.getElementById("url_div").style.borderBottom = "1px solid var(--errorColor)";
				document.getElementById('url_error').style.display = 'block';
				document.getElementById('url_error').innerHTML = i18next.t('urlFilter_dialog_edit_errDes5');
				return;
			}
		}

		toggle_add_modal();
		document.getElementById('modal_AddURLfilter').style = "display: none";
		document.getElementById('_modal_text').innerHTML = i18next.t('urlFilter_save_loading');
		toggle_modal();

		<!-- //prepare json data -->
        const req = {}; //create javascript object;
        req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;
		req.url_addr = document.getElementById('url_Addr').value;
		//console.log("req = " + JSON.stringify(req));
		do_fetch_api("POST", "/cgi-bin/cgi/urlfilter_add_save.cgi", req)
            .then(response_add_urlfilter).catch(response_print);
	}
	function response_add_urlfilter(data_json)
	{
		//console.log("res: " + JSON.stringify(data_json));
		if(!data_json.result)
		{
			document.getElementById("RequestVerifyToken").value = data_json.RequestVerifyToken;
			setTimeout(toggle_modal,1000);
			<!-- toggle_modal(); -->
			setTimeout(show_url_error,1000);
        }
		else
		{
            setTimeout(() => {window.location.href = "/cgi-bin/cm/fw-urlfilter.html";}, 1000);
        }
    }
	function show_url_error()
	{
        document.getElementById('_dialog_modal_header').innerHTML = i18next.t('Error_meg_title');
        document.getElementById('_dialog_modal_text').innerHTML = "";
        document.getElementById('_dialog_modal_warning').innerHTML = i18next.t('urlFilter_dialog_errDes');
        toggle_dialog_modal();
    }

	{

		<!-- g_rule_list = url_array[index].url; -->

	}
	function confirm_delete()
	{
		toggle_check_modal()
		document.getElementById('modal_AddURLfilter').style = "display: none";
		document.getElementById('_modal_text').innerHTML = i18next.t('urlFilter_save_loading');
		toggle_modal();

		//prepare json data
        const req = {}; //create javascript object;
        req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;
		req.del_instance = g_rule_list;
		//console.log("req = " + JSON.stringify(req));
		do_fetch_api("POST", "/cgi-bin/cgi/urlfilter_delete_save.cgi", req)
            .then(response_add_ipfilter).catch(response_print);
	}

	function sortNumber()
	{
        sortNumberStatus = sortNumberStatus%2;
        pageIdx = 0;
        sortURLStatus = 1;
        document.getElementById(platform + '-sortURLImg').src="/images/iconSort.svg";
		switch(sortNumberStatus){
			case 1:
				//A-Z
				document.getElementById(platform + '-sortNumberImg').src="/images/iconA-Z.svg";
				url_array.sort(function(a, b) {
					if(a.index < b.index) { return -1; }
					if(a.index > b.index) { return 1; }
					return 0;
				});
			break;
			case 0:
				//Z-A
				document.getElementById(platform + '-sortNumberImg').src="/images/iconZ-A.svg";
				url_array.sort(function(a, b) {
					if(a.index > b.index) { return -1; }
					if(a.index < b.index) { return 1; }
					return 0;
				});
			break;
			default:
			break;
		}
		initAddrListTable(url_array);
        sortNumberStatus++;
    }
	function sortURL()
	{
        sortURLStatus = sortURLStatus%2;
        pageIdx = 0;
        sortNumberStatus = 1;
        document.getElementById(platform + '-sortNumberImg').src="/images/iconSort.svg";

			case 1:

				url_array.sort(function(a, b) {
					if(a.url < b.url) { return -1; }

					return 0;
				});
			break;
			case 0:
				//Z-A
