	function update_content(data_json)
	{
		document.getElementById("RequestVerifyToken").value = data_json.RequestVerifyToken;
		return data_json;
	}
    function initJS_function(pf){
		document.getElementById(pf + "-sortNameBtn").onclick = function(){sortElement('hostName');};
		document.getElementById(pf + "-sortMacBtn").onclick = function(){sortElement('mac');};
		document.getElementById(pf + "-sortIPBtn").onclick = function(){sortElement('ip');};
		document.getElementById(pf + "-sortIntfBtn").onclick = function(){sortElement('intf');};
	}
	function cfgCollapseAltSwitch(id, collapsed = false){
		document.getElementById(id).addEventListener('hidden.bs.collapse', function () {
			document.getElementById(id+"-img").alt = i18next.t('common_alt_expand');
		});
		document.getElementById(id).addEventListener('shown.bs.collapse', function () {
			document.getElementById(id+"-img").alt = i18next.t('common_alt_collapse');
		});
		if(collapsed)
			document.getElementById(id+"-img").alt = i18next.t('common_alt_collapse');
		else
			document.getElementById(id+"-img").alt = i18next.t('common_alt_expand');
	}
    function bodyLoad() {
        /* menuOnLoad() is needed for every page, input parameter indicates actived menu item */
        menuOnLoad("client-status.html");
		do_fetch_api("POST", "/cgi-bin/cgi/token_query.cgi", '{}')
			.then(update_content)
			<!-- .then(reload_macfilter) -->
			.catch(response_print);
        /* Add your onload function call here: Start */
        mobile_CollapsibleAddListener('collapseIAFL');
		saveLoadingListener();
		cfgCollapseAltSwitch('collapseIAFL');
		document.getElementById('_loading_img1').alt = i18next.t('modal_loading');
		document.querySelectorAll('.modal-header > .btn-close').forEach((btn) => {
			btn.setAttribute('aria-label', i18next.t('close'));
		});
		document.querySelectorAll('.cardViewSortBtn').forEach((btn) => {
			btn.setAttribute('aria-label', i18next.t('common_alt_sort'));
		});
		
        document.getElementById("mobile-hostName-head").style.display = "none";
        document.getElementById("mobile-MAC-head").style.display = "none";
        document.getElementById("mobile-sortIntfBtn").style.display = "none";
		client_list = clients_json.client_list;
        onScreenWidthChange();//First time Init
        trigger_retrieve();
        window.onresize = function(event) {
            onScreenWidthChange();
        }
        /* Add your onload function call here: End */
    }
    function onScreenWidthChange(){
        if(window.innerWidth >= 1400)
            platform = 'xxl';
        else if(window.innerWidth < 1400 && window.innerWidth >= 576 )
            platform = 'xl';
        else if(window.innerWidth < 576)
            platform = 'mobile';

        initJS_function(platform);
        re_sortElement();
    }
	function client_status_parsing(data_json){
        //console.log("json = " + JSON.stringify(data_json));
        client_list = data_json.client_list;
        re_sortElement();
		return data_json;
	}
    function trigger_retrieve(){
		var refresh_time = parseInt(http_gui_refresh);
        if((false == isNaN(refresh_time)) && (0 != refresh_time)){         
            setTimeout(client_status_retrieve,refresh_time*1000);
        }else {
            console.log("http_gui_refresh is NaN or Zero.");
        }
	}
    function client_status_retrieve(){
    	const req = {}; //create javascript object;
    	req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;
    	do_fetch_api("POST", "/cgi-bin/cgi/client_status_retrieve.cgi", req)
		.then(update_content)
		.then(client_status_parsing)
		.then(trigger_retrieve)
    	.catch(response_print);
    }
	function initClientListTable(entries)
	{
		var tbodyRules = document.getElementById(platform + '-tbodyRules');
        var tbodyRulesCon = '';
        var tbodyRulesAll = '';
        tbodyRules.innerHTML = '';
		for(var i = 0; i < entries.length; i++)
        {
			var dev = entries[i].hostName;
			var mac = entries[i].mac;
			var ip = entries[i].ip;
			var intf = entries[i].intf;
			tbodyRulesCon = '<tr class="cardViewTableTR">';

		    if(platform != 'mobile')
			{
				tbodyRulesCon = tbodyRulesCon + '<td class="w-30 cardViewTableTD"><label>' +dev+ '</label></td>';
                tbodyRulesCon = tbodyRulesCon + '<td class="w-30 cardViewTableTD"><label>' +mac+ '</label></td>';
			}
            tbodyRulesCon = tbodyRulesCon + '<td class="w-30 cardViewTableTD"><label>' +ip+ '</label></td>';
            if(platform != 'mobile')
            {
                tbodyRulesCon = tbodyRulesCon + '<td class="w-30 cardViewTableTD"><label>' +intf+ '</label></td>';
            }else{
                detailIcon = '<button class="btn" id="detail_' + i + '">';
				detailIcon += '<img alt="' + i18next.t('common_alt_more_info') + '"src="/images/iconMore.svg">';
				detailIcon += '</button>';
                tbodyRulesCon = tbodyRulesCon + '<td class="w-30 cardViewTableTD"><label>' +detailIcon+ '</label></td>';
            }

            tbodyRulesCon += '</tr>';
            tbodyRulesAll += tbodyRulesCon;
		}
        tbodyRules.innerHTML = tbodyRulesAll;
        if(platform === 'mobile'){
            for(var i = 0; i < entries.length; i++)(function(i){
                document.getElementById("detail_"+i).onclick = function(){client_detail(i);};
            })(i);
        }
	}
    
    function client_detail(index){
        document.getElementById('_more_client_devname').innerHTML = client_list[index].hostName;
		document.getElementById('_more_client_macaddr').innerHTML = client_list[index].mac;
        document.getElementById('_more_client_ip').innerHTML = client_list[index].ip;
        document.getElementById('_more_client_interface').innerHTML = client_list[index].intf;
        toggle_MoreInfo_client_modal();
    }

	var counter = 0;
    function toggle_img(){
        let img1 = document.getElementById('_loading_img1');
        var degree = (10 * counter++)%360;
         img1.style.transform = "rotate("+degree+"deg)";
    }
	function saveLoadingListener() {
        var myTimer;
        var myModalEl = document.getElementById('_loadingModal');
        myModalEl.addEventListener('show.bs.modal', function (event) {
            myTimer = setInterval(toggle_img, 30);
        });
        myModalEl.addEventListener('hidden.bs.modal', function (event) {
            clearInterval(myTimer);
            counter = 0;
        });
    }
	function response_print(response){
        console.log("type: "+response.type);
        console.log("url: "+response.url);
        console.log("status: "+response.status);
        console.log("statusText: "+response.statusText);
        console.log("ok: "+response.ok);
    }

    function toggle_MoreInfo_client_modal(){
        var _myModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('_MoreInfo_client_modal'));
        _myModal.toggle();
    }
	var sortNameStatus = 0;
	var sortMacStatus = 0;
	var sortIPStatus = 0;
	var sortIntfStatus = 0;
    var element_name = 'hostName';
	function sortElement(element)
	{
		var sortImg = '-sortNameImg';
		var sortStatus = 0;
        element_name = element;
		if(element == 'hostName'){
			sortImg = '-sortNameImg';
			sortStatus = sortNameStatus%2;
		}
		else{
			sortNameStatus = 1;
			document.getElementById(platform + '-sortNameImg').src="/images/iconSort.svg";
			document.getElementById(platform + '-sortNameImg').alt = i18next.t('common_alt_unsort');
		}
		if(element == 'mac'){
			sortImg = '-sortMacImg';
			sortStatus = sortMacStatus%2;
		}
		else{
			sortMacStatus = 1;
			document.getElementById(platform + '-sortMacImg').src="/images/iconSort.svg";
			document.getElementById(platform + '-sortMacImg').alt = i18next.t('common_alt_unsort');
		}
		if(element == 'ip'){
			sortImg = '-sortIPImg';
			sortStatus = sortIPStatus%2;
		}
		else{
			sortIPStatus = 1;
			document.getElementById(platform + '-sortIPImg').src="/images/iconSort.svg";
			document.getElementById(platform + '-sortIPImg').alt = i18next.t('common_alt_unsort');
		}
		if(element == 'intf'){
			sortImg = '-sortIntfImg';
			sortStatus = sortIntfStatus%2;
		}
		else{
			sortIntfStatus = 1;
			document.getElementById(platform + '-sortIntfImg').src="/images/iconSort.svg";
			document.getElementById(platform + '-sortIntfImg').alt = i18next.t('common_alt_unsort');
		}
		switch(sortStatus){
			case 1:
				//A-Z
				document.getElementById(platform + sortImg).src="/images/iconA-Z.svg";
				document.getElementById(platform + sortImg).alt = i18next.t('common_alt_ascending');
				client_list.sort(function(a, b) {
					if(a[element] < b[element]) { return -1; }
					if(a[element] > b[element]) { return 1; }
					return 0;
				});
			break;
			case 0:
				//Z-A
				document.getElementById(platform + sortImg).src="/images/iconZ-A.svg";
				document.getElementById(platform + sortImg).alt = i18next.t('common_alt_descending');
				client_list.sort(function(a, b) {
					if(a[element] > b[element]) { return -1; }
					if(a[element] < b[element]) { return 1; }
					return 0;
				});
			break;
			default:
			break;
		}
		initClientListTable(client_list);
		if(element == 'hostName')
			sortNameStatus = ++sortStatus;
		if(element == 'mac')
			sortMacStatus = ++sortStatus;
		if(element == 'ip')
			sortIPStatus = ++sortStatus;
		if(element == 'intf')
			sortIntfStatus = ++sortStatus;
    }
    function re_sortElement()
	{
		if(element_name == 'hostName')
			sortNameStatus = ++sortNameStatus%2;
		if(element_name == 'mac')
			sortMacStatus = ++sortMacStatus%2;
		if(element_name == 'ip')
			sortIPStatus = ++sortIPStatus%2;
		if(element_name == 'intf')
			sortIntfStatus = ++sortIntfStatus%2;
		
		sortElement(element_name);
    }

    </script>
