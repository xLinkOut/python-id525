us").innerText = "Initializing";            break;            case 2:                 document.getElementById(platform + "-voip_registration_status").innerText = "Registering";            break;            case 3:                 document.getElementById(platform + "-voip_registration_status").innerText = "Unregistering";            break;            case 4:                 document.getElementById(platform + "-voip_registration_status").innerText = "Error";            break;            case 5:                 document.getElementById(platform + "-voip_registration_status").innerText = "Testing";            break;            case 6:                 document.getElementById(platform + "-voip_registration_status").innerText = "Quiescent";            break;            case 7:                 document.getElementById(platform + "-voip_registration_status").innerText = "Disabled";            break;            default:                document.getElementById(platform + "-voip_registration_status").innerText = "Disabled";        }    }    var dnssrv = 0;    function checkDNS_SRV() {        if(document.getElementById(platform+"-voip_DNS_SRV_check").checked)            dnssrv = 1;        else            dnssrv = 0;    }    var lineEnable = 1;    function checkLineEnable() {        if(document.getElementById(platform+"-voip_lineEnable_check").checked)            lineEnable = 1;        else            lineEnable = 0;    }    var posModeEnable = 0;    function checkPosModeEnable() {        if(document.getElementById(platform+"-voip_pos_mode_enable_check").checked)            posModeEnable = 1;        else            posModeEnable = 0;    }    function response_apply_voip(data_json){        //console.log("res: " + JSON.stringify(data_json));        if(!data_json.result){            document.getElementById("RequestVerifyToken").value = data_json.RequestVerifyToken;			show_EditError(i18next.t('voip_dialog_err6', {errorID:data_json.error_code}));			return;		}else {		    setTimeout(() => {window.location.href = "/cgi-bin/cm/voip-settings.html";}, 1000);		}    }    function apply_voip(){        var sip_domain = document.getElementById(platform + "-voip_SIP_Domain_text").value;        var proxy_server = document.getElementById(platform + "-voip_proxy_server_text").value;        var outbound_proxy = document.getElementById(platform + "-voip_outbound_proxy_text").value;        var sip_account = document.getElementById(platform + "-voip_account_text").value;        var sip_password = document.getElementById(platform + "-voip_password_text").value;        var sip_callID = document.getElementById(platform + "-voip_telephone_num_text").value;        if(outbound_proxy.length <= 0 && proxy_server.length <= 0){            show_EditError(i18next.t('voip_dialog_err5'));        }else if(sip_callID.length <= 0){            show_EditError(i18next.t('voip_dialog_err7'));        }else if(sip_domain.length > 0 && (!validateFQDN(sip_domain)) && (!checkIP(document.getElementById(platform + "-voip_SIP_Domain_text")))){            show_EditError(i18next.t('voip_dialog_err2'));        }else if(proxy_server.length > 0 && (!validateFQDN(proxy_server)) && (!checkIP(document.getElementById(platform + "-voip_proxy_server_text")))){            show_EditError(i18next.t('voip_dialog_err4'));        }else if(outbound_proxy.length > 0 && (!validateFQDN(outbound_proxy)) && (!checkIP(document.getElementById(platform + "-voip_outbound_proxy_text")))){            show_EditError(i18next.t('voip_dialog_err5'));        }else{            document.getElementById('_modal_text').innerHTML = i18next.t('voip_save_loading');            toggle_modal();            <!-- //prepare json data -->            const req = {}; //create javascript object;            req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;            req.sip_domain = sip_domain;            req.proxy_server = proxy_server; dInterface = apnJsonList[text].profile_handle;            }        }else if(id.indexOf("") != -1){                }    }//Modal    function toggle_modal(){        var _myModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('_loadingModal'));        _myModal.toggle();    }    var counter = 0;    function toggle_img(){        let img1 = document.getElementById('_loading_img1');        var degree = (10 * counter++)%360;         img1.style.transform = "rotate("+degree+"deg)";    }    function saveLoadingListener() {        var myTimer;        var myModalEl = document.getElementById('_loadingModal');        myModalEl.addEventListener('show.bs.modal', function (event) {            myTimer = setInterval(toggle_img, 30);        });        myModalEl.addEventListener('hidden.bs.modal', function (event) {            clearInterval(myTimer);            counter = 0;        });    }    function toggle_dialog_modal(){        var _myModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('_dialog_modal'));        _myModal.toggle();    }    function saveDialogListener() {        var myModalEl = document.getElementById('_dialog_modal');        myModalEl.addEventListener('show.bs.modal', function (event) {                    });        myModalEl.addEventListener('hidden.bs.modal', function (event) {                    });    }    function set_EAA_ToItem(p_id){        var _ImgLength = document.getElementById(p_id).getElementsByTagName("IMG").length;        var _Imgs = document.getElementById(p_id).getElementsByTagName("IMG");        for(var _i=0;_i<_ImgLength;_i++)        {            if(_Imgs[_i].hasAttribute("data-i18n-img-alt")){                var i18nImgKey = _Imgs[_i].getAttribute("data-i18n-img-alt");                if(i18nImgKey.length > 0){                    _Imgs[_i].setAttribute("alt", i18next.t(i18nImgKey));                }else{                    _Imgs[_i].setAttribute("alt", "");
