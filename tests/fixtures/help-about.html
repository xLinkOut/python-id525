	function cfgCollapseAltSwitch(id, collapsed = false){
		document.getElementById(id).addEventListener('hidden.bs.collapse', function () {
			document.getElementById(id+"-img").alt = i18next.t('common_alt_expand');
		});
		document.getElementById(id).addEventListener('shown.bs.collapse', function () {
			document.getElementById(id+"-img").alt = i18next.t('common_alt_collapse');
		});
		if(collapsed)
			document.getElementById(id+"-img").alt = i18next.t('common_alt_collapse');
		else
			document.getElementById(id+"-img").alt = i18next.t('common_alt_expand');
	}

/* Change object text when selected item(s) */
    function setOnclickByClassName(className,func) {
        var elements = document.getElementsByClassName(className);
        for(i=0; i < elements.length; i++)
            elements[i].onclick = func;
    }
    function setInnerHtmlByClassName(className,text) {
        var elements = document.getElementsByClassName(className);
        for(i=0; i < elements.length; i++)
            elements[i].innerHTML = text;
    }
    function setStyleByClassName(className,style) {
        var elements = document.getElementsByClassName(className);
        for(i=0; i < elements.length; i++)
            elements[i].style = style;
    }
    function setHrefByClassName(className,href) {
        var elements = document.getElementsByClassName(className);
        for(i=0; i < elements.length; i++)
            elements[i].href = href;
    }
