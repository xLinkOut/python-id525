    <script nonce="cdide4o6gf" language="JavaScript">
    var platform = '';
    var platform_o = '';
    
    var pingTimes = 0;
    var pingCount = 10;
    var pingHost = '192.168.224.1';
    var pingSize = 32;
    var pingTimer;
    var pingTestResult;
    
    var isStopTest = false;

    function response_print(response){
        //console.log("type: "+response.type);
        //console.log("url: "+response.url);
        //console.log("status: "+response.status);
        //console.log("statusText: "+response.statusText);
        //console.log("ok: "+response.ok);
        //setTimeout(() => {toggle_modal();}, 1000);        
    }
    function update_content(data_json){
        //console.log("result: "+ data_json.result);
        //console.log("token: "+ data_json.RequestVerifyToken);
        document.getElementById("RequestVerifyToken").value = data_json.RequestVerifyToken;
    }

    function bodyLoad() {
        /* menuOnLoad() is needed for every page, input parameter indicates actived menu item */
        menuOnLoad("self-ping.html");
        do_fetch_api("POST", "/cgi-bin/cgi/token_query.cgi", '{}').then(update_content).catch(response_print);
        /* Add your onload function call here: Start */
        mobile_CollapsibleAddListener('collapsePT', true);
        saveLoadingListener();
        saveDialogListener();
        
        if(window.innerWidth >= 1400)
            platform_o = 'xxl';
        else if(window.innerWidth < 1400 && window.innerWidth >= 576 )
            platform_o = 'xl';
        else if(window.innerWidth < 576)
            platform_o = 'mobile';
        initJS_function(platform_o);

        onScreenWidthChange();//First time Init
        window.onresize = function(event) {
            onScreenWidthChange();
        }
        /* Add your onload function call here: End */
    }
    function initJS_function(pf){
        document.getElementById("_dialog_btn").onclick = function(){toggle_dialog_modal();};
        document.getElementById(pf + "-PingTestBtn").onclick = function(){testStart();};
        document.getElementById(pf + "-PacketSizeText").oninput = function(){pingSizeInput();};
        document.getElementById(pf + "-CountText").oninput = function(){pingCountInput();};
        document.getElementById(pf + "-IPAddressText").oninput = function(){pingHostInput();};

    }
    function onScreenWidthChange(){
        if(window.innerWidth >= 1400)
            platform = 'xxl';
        else if(window.innerWidth < 1400 && window.innerWidth >= 576 )
            platform = 'xl';
        else if(window.innerWidth < 576)
            platform = 'mobile';
//console.log('platform: '+platform);
        if(platform != platform_o){
            initJS_function(platform);
            platform_o = platform;
        }
        document.getElementById(platform + '-CountText').value = pingCount;
        document.getElementById(platform + '-IPAddressText').value = pingHost;
        document.getElementById(platform + '-PacketSizeText').value = pingSize;
    }
    
    function testStart(){
        pingTimes = 0;
        pingTestResult = document.getElementById(platform + '-PingTestResult');
        if(document.getElementById(platform + '-PingTestBtn').innerHTML === i18next.t('Btn_start')){
            pingCount = parseInt(document.getElementById(platform + '-CountText').value, 10);
            pingHost = document.getElementById(platform + '-IPAddressText').value;
            pingSize = parseInt(document.getElementById(platform + '-PacketSizeText').value, 10);
            if(pingHost.length <= 0){
                show_EditError(i18next.t('ping_res_hostEmpty'));
            }else if(pingSize <= 0 || document.getElementById(platform + '-PacketSizeText').value.length <= 0){
                show_EditError(i18next.t('ping_res_sizeIssue'));
            }else if(pingCount <= 0 || document.getElementById(platform + '-CountText').value.length <= 0){
                show_EditError(i18next.t('ping_res_countIssue'));
            }else{
                pingTestResult.innerHTML = '';
                document.getElementById(platform + '-PingTestBtn').innerHTML = i18next.t('Btn_stop');
                isStopTest = false;
                pingTimer = setTimeout(pingTest, 500);
            }
        }else{
            toggle_modal();
            isStopTest = true;
            setTimeout(() => {
                document.getElementById(platform + '-PingTestBtn').innerHTML = i18next.t('Btn_start');
                toggle_modal();
                clearTimeout(pingTimer);
            }, 2100);
        }
    }
    
    function pingTest_response(data_json){
        document.getElementById('RequestVerifyToken').value = data_json.RequestVerifyToken;
        if(!data_json.result){
            //console.log("res: " + JSON.stringify(data_json));
            document.getElementById(platform + '-PingTestBtn').innerHTML = i18next.t('Btn_start');
            var tmp_str = i18next.t('ping_res_Fail'); + '<br>';
            pingTestResult.innerHTML += tmp_str;
        }else {
            pingTimes++;
            //Start ping...
            if(pingTimes > pingCount){
                pingTimes = 0;
                document.getElementById(platform + '-PingTestBtn').innerHTML = i18next.t('Btn_start');
            }else{
                //console.log('ping_result: '+ data_json.ping_result);
                if(!isStopTest){
                    pingTimer = setTimeout(pingTest, 1000);
                }
                var tmp_str = data_json.ping_result + '<br>';
                pingTestResult.innerHTML += tmp_str.replace(/seq=0/g,'');
            }
        }
    }
    function pingTest(){
        //prepare json data
        const req = {}; //create javascript object;
        req.RequestVerifyToken = document.getElementById('RequestVerifyToken').value;
        req.pingCount = pingCount;
        req.pingHost = pingHost;
        req.pingSize = pingSize;
        //console.log("req:" + JSON.stringify(req));

        do_fetch_api("POST", "/cgi-bin/cgi/req_pingTest.cgi", req)
        .then(response => {return response}).then(pingTest_response).catch(response_print);
    }
    
    function pingCountInput() {
        pingCount = parseInt(document.getElementById(platform + '-CountText').value, 10);
    }
    
    function pingHostInput() {
        pingHost = document.getElementById(platform + '-IPAddressText').value;
    }
    
    function pingSizeInput() {
        pingSize = parseInt(document.getElementById(platform + '-PacketSizeText').value, 10);
    }
    
    function show_EditError(msg){
        document.getElementById('_dialog_modal_header').innerHTML = i18next.t('Error_meg_title');
        document.getElementById('_dialog_modal_text').innerHTML = "";
        document.getElementById('_dialog_modal_warning').innerHTML = msg;
        
        toggle_dialog_modal();
    }
    
    function hidePass_toggle(toggleid, id)
	{
		var password_eye = document.getElementById(toggleid);
		var password_input = document.getElementById(id);
		if(password_input.type === "password")
		{
			password_input.type = "text";
			password_eye.src = "/images/iconPasswordShow.svg";
		}
		else if(password_input.type === "text")
		{
			password_input.type = "password";
			password_eye.src = "/images/iconPasswordHide.svg";
		}
	}

        var selectItem = document.getElementById(id);

        selectItem.innerHTML = text;

        }else if(id.indexOf("") != -1){
        
        }
    }
//Modal
    function toggle_modal(){
        var _myModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('_loadingModal'));
        _myModal.toggle();
    }
    var counter = 0;
    function toggle_img(){
        let img1 = document.getElementById('_loading_img1');
        var degree = (10 * counter++)%360;
         img1.style.transform = "rotate("+degree+"deg)";
    }
    function saveLoadingListener() {
        var myTimer;
        var myModalEl = document.getElementById('_loadingModal');
        myModalEl.addEventListener('show.bs.modal', function (event) {
            myTimer = setInterval(toggle_img, 30);
        });
        myModalEl.addEventListener('hidden.bs.modal', function (event) {
            clearInterval(myTimer);
            counter = 0;
        });
    }
    function toggle_dialog_modal(){
        var _myModal = bootstrap.Modal.getOrCreateInstance(document.getElementById('_dialog_modal'));
        _myModal.toggle();
    }
    function saveDialogListener() {
        var myModalEl = document.getElementById('_dialog_modal');
        myModalEl.addEventListener('show.bs.modal', function (event) {
            
        });
        myModalEl.addEventListener('hidden.bs.modal', function (event) {
            
        });
    }

    function set_EAA_ToItem(p_id){
        var _ImgLength = document.getElementById(p_id).getElementsByTagName("IMG").length;
        var _Imgs = document.getElementById(p_id).getElementsByTagName("IMG");
        for(var _i=0;_i<_ImgLength;_i++)
        {
            if(_Imgs[_i].hasAttribute("data-i18n-img-alt")){
                var i18nImgKey = _Imgs[_i].getAttribute("data-i18n-img-alt");
                if(i18nImgKey.length > 0){
                    _Imgs[_i].setAttribute("alt", i18next.t(i18nImgKey));
                }else{
                    _Imgs[_i].setAttribute("alt", "");
                }
            }
        }
        
        var _InputLength = document.getElementById(p_id).getElementsByTagName("INPUT").length;
        var _Inputs = document.getElementById(p_id).getElementsByTagName("INPUT");
        for(var _i=0;_i<_InputLength;_i++)
        {
            if(_Inputs[_i].hasAttribute("data-i18n-img-alt") && _Inputs[_i].type == 'image'){
                var i18nKey = _Inputs[_i].getAttribute("data-i18n-img-alt");
                if(i18nKey.length > 0){
                    _Inputs[_i].setAttribute("alt", i18next.t(i18nKey));
                }else{
                    _Inputs[_i].setAttribute("alt", "");
                }
            }
            if(_Inputs[_i].hasAttribute("data-i18n-aria-label")){
                var i18nKey = _Inputs[_i].getAttribute("data-i18n-aria-label");
                if(i18nKey.length > 0){
                    _Inputs[_i].setAttribute("aria-label", i18next.t(i18nKey));
                }else{
                    _Inputs[_i].setAttribute("aria-label", "");
                }
            }
        }
        
        var _BtnLength = document.getElementById(p_id).getElementsByTagName("BUTTON").length;
        var _Btns = document.getElementById(p_id).getElementsByTagName("BUTTON");
        for(var _i=0;_i<_BtnLength;_i++)
        {
            if(_Btns[_i].hasAttribute("data-i18n-aria-label")){
                var i18nImgKey = _Btns[_i].getAttribute("data-i18n-aria-label");
                if(i18nImgKey.length > 0){
                    _Btns[_i].setAttribute("aria-label", i18next.t(i18nImgKey));
                }else{
                    _Btns[_i].setAttribute("aria-label", "");
                }
            }
        }
    }
