[project]
name = "id525"
version = "0.2.1"
description = "Async Python client and CLI for the General Mobile ID525 5G FWA router web API (read-only by default, writes opt-in)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luca Cirillo" }]
requires-python = ">=3.12"
keywords = ["router", "5g", "fwa", "general-mobile", "id525", "home-assistant", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.scripts]
id525 = "id525.cli:main"

[project.urls]
Repository = "https://github.com/xLinkOut/python-id525"
Issues = "https://github.com/xLinkOut/python-id525/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "playwright>=1.63.0",
    "pytest>=8.3",
    "pytest-aiohttp>=1.0.5",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "ASYNC", "PL", "PT", "RET",
    "TC", "D", "N", "S", "BLE", "FBT", "ERA", "T20", "DTZ",
]
ignore = [
    "D203", "D213", "D105", "D107",
    "PLR2004", # magic values: the router protocol is full of them
    "PLR0913",
    "S101",    # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "PLR", "FBT", "ARG", "TC", "C901", "PLC0415"]
"src/id525/const.py" = ["S105"]  # token *field names*, not secrets
"src/id525/endpoints.py" = ["S105"]  # endpoint names such as "token_query"
"tools/uicapture/scenarios/**" = ["D103"]  # UI drivers: the Scenario declaration documents them
"tools/**" = ["T201"]  # command-line tools print

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov=id525 --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: runs headless Chromium (tools/uicapture); needs `playwright install chromium`"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
